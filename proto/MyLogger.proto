
syntax = "proto3";
import "google/protobuf/empty.proto";
package my_logger;

enum LogLevelGrpcModel{
    Info = 0;
    Warning = 1;
    Error = 2;
    Fatal = 3;
    Debug = 4;
}

message LogEventGrpcModel{
    string TenantId = 1;
    int64 Timestamp = 2;
    string ProcessName =3;
    string Message = 4;
    LogLevelGrpcModel Level = 5;
    repeated LogEventContext Ctx = 6;
}

message LogEventContext{
    string Key = 1;
    string Value = 2;
}

message GetStatisticsRequest{
    string UiUrl = 1;
    int64 FromTime =2;
    int64 ToTime =3;
}

message ReadLogEventRequest{
    string UiUrl = 1;
    int64 FromTime =2;
    int64 ToTime =3;
    int32 Take = 4;
    int32 Skip = 5;
    repeated LogLevelGrpcModel Levels = 6;
    repeated LogEventContext ContextKeys = 7;
    // The default product scope when it is not set
    optional string ProductScope = 8;
}

message StatisticData{
    int32 InfoCount = 1;
    int32 WarningCount = 2;
    int32 ErrorCount = 3;
    int32 FatalCount = 4;
    int32 DebugCount = 5;
}

message IgnoreEventGrpcModel{
    LogLevelGrpcModel Level = 1;
    string Application = 2;
    string Marker = 3;
    optional int64 Expiration = 4;
}

message DeleteIgnoreEventGrpcRequest{
    LogLevelGrpcModel Level = 1;
    string Application = 2;
    string Marker = 3;
}

// FromTime and ToTime are encoded as in ReadLogEventRequest. Levels, ContextKeys and Phrase
// filter together; an empty one does not filter.
message SearchLogsRequest{
    string UiUrl = 1;
    int64 FromTime = 2;
    int64 ToTime = 3;
    int32 Take = 4;
    repeated LogLevelGrpcModel Levels = 5;
    repeated LogEventContext ContextKeys = 6;
    string Phrase = 7;
    // The default product scope when it is not set
    optional string ProductScope = 8;
}

message ScanAndSearchRequest{
    string UiUrl = 1;
    string Phrase = 2;
    int64 FromTime = 3;
    int64 ToTime = 4;
    int32 Take = 5;
    // The default product scope when it is not set
    optional string ProductScope = 6;
}

message IgnoreSingleEventGrpcModel{
    string Id = 1;
    repeated LogLevelGrpcModel Levels = 2;
    string MessageMatch = 3;
    repeated LogEventContext ContextMatch = 4;
    uint64 SkipAmount = 5;
    uint64 MinutesToWait = 6;
}

message DeleteIgnoreSingleEventGrpcRequest{
    string Id = 1;
}


message GetHourlyStatisticsRequest{
    int64 AmountOfHours = 1;
}

message HourlyStatisticsGrpcModel{
    uint64 HourKey = 1;
    string App = 2;
    uint32 InfoCount = 3;
    uint32 WarningCount = 4;
    uint32 ErrorCount = 5;
    uint32 FatalCount = 6;
    uint32 DebugCount = 7;
    // The product scope the records of the application went to
    string Scope = 8;
}

message GetInsightsKeysResponse{
    repeated string Keys = 1;
}

message GetInsightsValuesRequest{
    string Key = 1;
    string Phrase = 2;
}

message GetInsightsValuesResponse{
    repeated string Values = 1;
}


// Applications are the regular expressions an application name matches whole, ignoring
// case. A scope there are records of, but not set, has none.
message ProductScopeGrpcModel{
    string Name = 1;
    repeated string Applications = 2;
}

// The default scope first - where the records no scope matches go - then the scopes in the
// order they are matched, then the other ones there are records of
message GetProductScopesResponse{
    string DefaultScope = 1;
    repeated ProductScopeGrpcModel Scopes = 2;
}

message ServerInfoGrpcResponse{
    string Version = 1;
    uint32 HoursToGc = 2;
}

service MyLogger {
    rpc Write(stream LogEventGrpcModel) returns (google.protobuf.Empty);
    rpc Read(ReadLogEventRequest) returns (stream LogEventGrpcModel);
    rpc GetStatistic(GetStatisticsRequest) returns (StatisticData);

    rpc ScanAndSearch(ScanAndSearchRequest) returns (stream LogEventGrpcModel);

    // From FromTime up - the oldest first - until ToTime or Take records
    rpc SearchUp(SearchLogsRequest) returns (stream LogEventGrpcModel);
    // From ToTime down - the latest first - until FromTime or Take records
    rpc SearchDown(SearchLogsRequest) returns (stream LogEventGrpcModel);

    rpc SetIgnoreEvent(IgnoreEventGrpcModel) returns (google.protobuf.Empty);
    rpc GetIgnoreEvents(google.protobuf.Empty) returns (stream IgnoreEventGrpcModel);
    rpc DeleteIgnoreEvent(DeleteIgnoreEventGrpcRequest) returns (google.protobuf.Empty);

    rpc GetInsightsKeys(google.protobuf.Empty) returns (GetInsightsKeysResponse);
    rpc GetInsightsValues(GetInsightsValuesRequest) returns ( GetInsightsValuesResponse);

    rpc SetIgnoreSingleEvent(IgnoreSingleEventGrpcModel) returns (google.protobuf.Empty);
    rpc GetIgnoreSingleEvents(google.protobuf.Empty) returns (stream IgnoreSingleEventGrpcModel);
    rpc DeleteIgnoreSingleEvent(DeleteIgnoreSingleEventGrpcRequest) returns (google.protobuf.Empty);

    // Of every product scope: a record per hour, scope and application
    rpc GetHourlyStatistics(GetHourlyStatisticsRequest) returns (stream HourlyStatisticsGrpcModel);


    rpc GetServerInfo(google.protobuf.Empty) returns (ServerInfoGrpcResponse);

    // The records of Write go to the scope its "scope" metadata names - by the product scopes
    // without it
    rpc GetProductScopes(google.protobuf.Empty) returns (GetProductScopesResponse);

    rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
 }