[package]
name = "my-logger-server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
my-http-server = { tag = "0.9.0", git = "https://github.com/MyJetTools/my-http-server.git", features = [
    "macros",
] }
my-http-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-http-utils.git", features = [
    "server",
] }
my-logger = { tag = "1.3.0", git = "https://github.com/MyJetTools/my-logger.git" }

rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "with-tokio",
] }

my-settings-reader = { tag = "0.5.0", git = "https://github.com/MyJetTools/my-settings-reader.git", features = [
    "background-reader",
] }

my-grpc-extensions = { tag = "0.7.0", git = "https://github.com/MyJetTools/my-grpc-extensions.git", features = [
    "grpc-server",
] }


flurl = { tag = "0.7.0", git = "https://github.com/MyJetTools/fl-url.git" }
my-s3 = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-s3.git" }

my-json = { tag = "0.3.2", git = "https://github.com/MyJetTools/my-json.git" }

elastic-client = { git = "https://github.com/MyJetTools/elastic-client", tag = "0.1.5" }

zstd = "0.13"
regex = "*"

mcp-server-middleware = { tag = "0.9.0", git = "https://github.com/my-ai-utils/mcp-server-middleware.git" }

async-trait = "*"
base64 = "0.22"
tonic = "0.14"
tonic-prost = "0.14"
anyhow = "*"
tokio = { version = "*", features = ["full"] }
prost = "0.14"
serde = { version = "*", features = ["derive"] }
futures-core = "*"
serde_yaml = "*"
serde_json = "*"
itoa = "1"
tikv-jemallocator = { version = "*", features = [
    "unprefixed_malloc_on_supported_platforms",
    "stats",
] }
tikv-jemalloc-ctl = { version = "*", features = ["stats"] }


[build-dependencies]
ci-utils = { git = "https://github.com/MyJetTools/ci-utils.git", tag = "0.1.3" }
